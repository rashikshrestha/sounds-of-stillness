quotes:
  - text: Some individuals are not meant to fit into existing circles; instead, they
      are here to create their own.
    attribution: Smarika
  - text: Meditation is the best minimalism approach that there is. In the end you
      have to even let go of yourself. Nothing remains.
    attribution: "@kneerub"
  - text: Nothing matters. What truly matters is the simple joy of existence.
    attribution: Smarika
  - text: When the mind is still and noble, respiration is still and calm and the
      body becomes stable and quiet. The mind is the controller and the king of
      the senses. Prana is the king of the mind, and rhythm is the king of
      Prana.
    attribution: Ancient Science of mantras - Om swami
